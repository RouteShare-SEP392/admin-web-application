name: Admin CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'pull_request'
      - uses: docker/build-push-action@v6
        if: github.event_name == 'pull_request'
        with:
          context: .
          platforms: linux/amd64

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/routeshare-sep392/admin-web-application:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "ghcr.io/routeshare-sep392/admin-web-application@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    concurrency:
      group: routeshare-admin-production
      cancel-in-progress: false
    permissions:
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      AWS_PAGER: ""
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - name: Validate deployment inputs
        run: |
          [[ "$INSTANCE_ID" =~ ^i-[0-9a-f]{17}$ ]] || { echo "::error::Set EC2_INSTANCE_ID in production."; exit 1; }
          [[ "$DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[[:graph:]]+$ ]] || { echo "::error::Set AWS_DEPLOY_ROLE_ARN in production."; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Missing published image digest."; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy Admin and wait
        run: |
          set -euo pipefail
          parameters=$(jq -cn --arg digest "$DIGEST" '{ImageDigest:[$digest]}')
          command_id=$(aws ssm send-command --document-name RouteShareDeployAdmin \
            --document-version 1 --instance-ids "$INSTANCE_ID" --timeout-seconds 120 \
            --parameters "$parameters" --query Command.CommandId --output text)
          echo "SSM command: $command_id · Digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
          for attempt in {1..50}; do
            if status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>ssm-error); then
              case "$status" in
                Success) exit 0 ;;
                Pending|InProgress|Delayed|Cancelling) ;;
                *) echo "::error::SSM deployment $command_id ended with status $status"; exit 1 ;;
              esac
            elif ! grep -q InvocationDoesNotExist ssm-error; then
              cat ssm-error >&2
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for SSM deployment $command_id"
          exit 1
